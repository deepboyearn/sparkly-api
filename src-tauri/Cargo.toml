[package]
name = "sparkly-api"
version = "1.2.0"
description = "High-Performance OpenAI-Compatible Local Bridge Proxy & API Dashboard"
authors = ["Sparkly Team"]
edition = "2021"


[lib]
name = "sparkly"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5"
home = "0.5"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Local shell/file tool execution for the /v1/responses agent loop.
# OFF by default: enabling it lets model-emitted tool calls run commands and
# touch files on the host. Opt in with `cargo run --features tool-execution`.
tool-execution = []

