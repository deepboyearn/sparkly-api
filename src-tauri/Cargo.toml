[package]
name = "sparkly-api"
version = "1.2.0"
description = "High-Performance OpenAI-Compatible Local Bridge Proxy & API Dashboard"
authors = ["Sparkly Team"]
edition = "2021"


[lib]
name = "sparkly"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
open = "5"
home = "0.5"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Local shell/file tool execution for the /v1/responses agent loop.
# OFF by default: enabling it lets model-emitted tool calls run commands and
# touch files on the host. Opt in with `cargo run --features tool-execution`.
tool-execution = []

# Rust unit/regression tests live beside their modules. Do not declare explicit
# integration-test targets unless the referenced files are present.

# Keep development compilation predictable on laptops and shared workstations.
# Dependency debug symbols are not needed for application-level debugging.
[profile.dev]
debug = 1
codegen-units = 16
incremental = true

[profile.dev.package."*"]
debug = 0
codegen-units = 16

